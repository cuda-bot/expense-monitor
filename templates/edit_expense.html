
<!DOCTYPE html>
<html>
<head>
  <title>Edit Expense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2>Edit Expense</h2>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" value="{{ expense[1] }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Amount (₹)</label>
        <input type="number" name="amount" value="{{ expense[2] }}" step="0.01" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="date" value="{{ expense[3] }}" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success">Save Changes</button>
      <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
