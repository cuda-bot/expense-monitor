
<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <div class="container my-4">
    <h1 class="text-center mb-4">📊 Expense Tracker Dashboard</h1>

    <div class="row text-center mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">💰 Total Expenses</h5>
            <p class="card-text display-6">₹{{ total_expenses }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">📅 This Month</h5>
            <p class="card-text display-6">₹{{ month_expenses }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">📊 Top Category</h5>
            <p class="card-text display-6">{{ top_category }}</p>
          </div>
        </div>
      </div>
    </div>

    <form method="get" class="d-flex justify-content-center mb-4">
      <label class="me-2 fw-bold">Filter by Category:</label>
      <select name="category" onchange="this.form.submit()" class="form-select w-auto">
        <option value="All" {% if selected_category == 'All' %}selected{% endif %}>All</option>
        {% for cat in categories %}
        <option value="{{ cat }}" {% if selected_category == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>
    </form>

    <table class="table table-bordered table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Category</th>
          <th>Amount (₹)</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        {% for e in expenses %}
        <tr>
          <td>{{ e[1] }}</td>
          <td>{{ e[2] }}</td>
          <td>{{ e[3] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="mt-5">
      <h4 class="text-center">📈 Expense Distribution</h4>
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('expenseChart').getContext('2d');
    const expenseChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: {{ chart_labels | tojson }},
        datasets: [{
          data: {{ chart_values | tojson }},
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom'
          },
          title: {
            display: true,
            text: 'Expenses by Category'
          }
        }
      }
    });
  </script>
</body>
</html>
